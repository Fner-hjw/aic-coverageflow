<!doctype html>
<!-- CoverageFlow web UI. Vanilla ES2022 SPA shell (stream A4).
     Hash-routed; all rendering happens in app.js; every UI action hits
     the FastAPI endpoints under /api (the UI never writes state files).
     Shell layout: fixed sidebar (grouped nav, collapse toggle) + topbar
     (quick search, live-status chip, profile block, primary action). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoverageFlow | Research operations</title>
  <link rel="stylesheet" href="/static/style.css?v=20261112-fieldset-cards">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>
  <div class="side-backdrop" id="side-backdrop" hidden></div>
  <div class="shell">

    <!-- ------------------------------------------------ sidebar ------ -->
    <aside class="sidebar" id="sidebar">
      <a class="wordmark" href="#/dashboard">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="30" height="30">
            <rect width="32" height="32" rx="9" class="logo-bg"></rect>
            <path d="M7 9v14M12 6v17M17 12v11M22 8v15M26 15v8" class="logo-path"></path>
          </svg>
        </span>
        <span class="wm-text">Coverage<em>Flow</em>
          <span class="no">Research operations</span>
        </span>
      </a>

      <nav class="sidenav" id="sidenav">
        <div class="side-group">Desk</div>
        <a href="#/dashboard">
          <svg class="ic" viewBox="0 0 20 20"><rect x="2.5" y="2.5" width="6.5" height="8" rx="1.6"/><rect x="11" y="2.5" width="6.5" height="5" rx="1.6"/><rect x="2.5" y="12.5" width="6.5" height="5" rx="1.6"/><rect x="11" y="9.5" width="6.5" height="8" rx="1.6"/></svg>
          Today</a>
        <a href="#/new">
          <svg class="ic" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" class="stroke"/></svg>
          Start coverage</a>
        <a href="#/bundles">
          <svg class="ic" viewBox="0 0 20 20"><path d="M3 5.5h9M3 10h9M3 14.5h6" class="stroke"/><rect x="13.5" y="10.5" width="4.5" height="6" rx="1.2" class="fill"/></svg>
          Source bundles</a>

        <div class="side-group">Tools</div>
        <a href="#/demo">
          <svg class="ic" viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="2.5" class="stroke" fill="none"/><path d="M7 8h6M7 12h4" class="stroke"/></svg>
          Rehearsal</a>
        <a href="#/replay">
          <svg class="ic" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" class="stroke" fill="none"/><path d="M8 7.5l5 2.5-5 2.5z" class="fill"/></svg>
          Run replays</a>
        <a href="#/terminal">
          <svg class="ic" viewBox="0 0 20 20"><path d="M4 6l3.5 4L4 14" class="stroke"/><path d="M9.5 14h6" class="stroke"/></svg>
          Activity log</a>
        <a href="#/backends">
          <svg class="ic" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="5" rx="1.5" class="stroke" fill="none"/><rect x="3" y="11" width="14" height="5" rx="1.5" class="stroke" fill="none"/><circle cx="6.2" cy="6.5" r="1" class="fill"/><circle cx="6.2" cy="13.5" r="1" class="fill"/></svg>
          Model routing</a>
      </nav>

      <div class="side-foot">
        <div class="conn-strip" id="conn-strip" title="Live event feed">
          <span class="dot"></span><span id="conn-label">Connecting</span>
        </div>
        <button class="side-collapse btn small" id="side-collapse" title="Collapse sidebar">
          <svg class="ic" viewBox="0 0 20 20"><path d="M12.5 4l-6 6 6 6" class="stroke"/></svg>
          Collapse
        </button>
      </div>
    </aside>

    <!-- ------------------------------------------------- main col ---- -->
    <div class="main-col">
      <header class="topbar">
        <button class="side-open" id="side-open" title="Show sidebar" aria-label="Show sidebar" aria-controls="sidebar" aria-expanded="false">
          <svg class="ic" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" class="stroke"/></svg>
        </button>

        <div class="search-wrap">
          <svg class="ic search-ic" viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.5" class="stroke" fill="none"/><path d="M13.2 13.2L17 17" class="stroke"/></svg>
          <input id="quick-search" type="text" autocomplete="off"
                 placeholder="Find a ticker or case…">
          <div class="search-pop" id="search-pop"></div>
        </div>

        <span class="spacer"></span>

        <a class="btn primary" href="#/new">
          <svg class="ic" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" class="stroke"/></svg>
          Start coverage</a>

        <div class="profile" title="Operatorʼs desk">
          <span class="avatar" aria-hidden="true">CF</span>
          <span class="who"><b>Research desk</b>
            <span>Local workspace</span>
          </span>
        </div>
      </header>

      <main id="view" class="view">
        <div class="loading">Opening the desk…</div>
      </main>
    </div>

  </div>

  <div id="toast"></div>
  <div id="pop"></div>  <!-- citation panels anchor here -->

  <script src="/static/normalise.js?v=20261112-case-delete"></script>
  <script src="/static/app.js?v=20261112-delete-toast"></script>
</body>
</html>
