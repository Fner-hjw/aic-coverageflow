<!doctype html>
<!-- CoverageFlow web UI — vanilla ES2022 SPA shell (stream A4).
     Hash-routed; all rendering happens in app.js; every UI action hits
     the FastAPI endpoints under /api (the UI never writes state files). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoverageFlow — coverage desk</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23faf9f6'/%3E%3Cpath d='M4 24 L12 8 L20 18 L28 6' stroke='%2317456b' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
</head>
<body>
  <header class="masthead">
    <div class="wordmark">Coverage<em>Flow</em>
      <span class="no">sell-side coverage · verified &amp; approved</span>
    </div>
    <nav class="topnav" id="topnav">
      <a href="#/dashboard">Dashboard</a>
      <a href="#/new">New case</a>
      <a href="#/bundles">Bundle builder</a>
      <a href="#/evolution">Evolution</a>
      <a href="#/demo">Demo panel</a>
      <a href="#/replay">Replay viewer</a>
      <a href="#/backends">Backends</a>
    </nav>
    <div class="conn-strip" id="conn-strip" title="live event feed">
      <span class="dot"></span><span id="conn-label">connecting</span>
    </div>
  </header>

  <div class="frame">
    <main id="view" class="view">
      <div class="loading">loading workspace…</div>
    </main>
  </div>

  <div id="toast"></div>
  <div id="pop"></div>  <!-- citation panels anchor here -->

  <script src="/static/app.js"></script>
</body>
</html>
